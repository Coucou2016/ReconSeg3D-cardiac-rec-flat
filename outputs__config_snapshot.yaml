seed: 42
deterministic: true
device: auto
output_dir: outputs
run_name: default
data:
  source: synthetic
  allow_fake_data: true
  in_channels: 1
  num_frames: 4
  spatial_size:
  - 8
  - 16
  - 16
  batch_size: 2
  num_workers: 0
  train_samples: 4
  val_samples: 2
  clinical_dim: 4
  slice_sampling: false
model:
  arch: reconseg3d
  in_channels: 1
  num_seg_classes: 5
  base_channels: 8
  temporal_mode: temporal_conv
  clinical_dim: 4
  dropout: 0.2
  per_frame_recon: true
  predict_motion: true
  per_frame_seg: true
  fusion: concat
  task: joint
loss:
  w_seg: 1.0
  w_recon: 0.5
  w_mace: 0.0
  recon_loss: l1
  mace_loss: bce
  use_dice: true
  alpha1: 0.1
  alpha2: 1.0
  alpha3: 0.0
  w_warp: 0.05
  w_cycle: 0.02
  w_inv: 0.1
  w_smooth: 0.05
  w_jac: 0.05
  jac_eps: 0.0
  w_loop: 0.05
  w_ed_ref: 0.05
  w_volsmooth: 0.01
  w_segsmooth: 0.0
  w_cox: 0.0
  w_phenotype: 0.0
metrics:
  hd95: false
selection:
  metric: loss_total
  mode: min
train:
  epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: false
  early_stop_patience: 0
