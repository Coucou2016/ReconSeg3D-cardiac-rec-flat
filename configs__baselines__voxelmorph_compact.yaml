# Compact VoxelMorph-style pairwise registration (small-grid fair compare).
# Train via MotionNet path inside ReconSeg3D or import CompactVoxelMorph directly.
# See docs/BASELINES.md — no invented clinical numbers.

seed: 42
deterministic: true
device: auto
output_dir: outputs/baselines/voxelmorph_compact
run_name: baseline_voxelmorph_compact

data:
  source: synthetic
  allow_fake_data: true
  in_channels: 1
  num_frames: 8
  spatial_size: [16, 32, 32]
  batch_size: 2
  num_workers: 0
  train_samples: 16
  val_samples: 8
  clinical_dim: 0
  slice_sampling: false

model:
  arch: reconseg3d
  in_channels: 1
  num_seg_classes: 4
  base_channels: 8
  temporal_mode: temporal_conv
  clinical_dim: 0
  dropout: 0.1
  per_frame_recon: true
  predict_motion: true
  per_frame_seg: false
  fusion: concat
  task: motion
  use_svf: false

loss:
  w_seg: 0.0
  w_recon: 0.1
  w_mace: 0.0
  recon_loss: l1
  use_dice: false
  alpha1: 0.1
  alpha2: 0.0
  w_warp: 0.2
  w_cycle: 0.0
  w_inv: 0.1
  w_smooth: 0.1
  w_jac: 0.05
  w_loop: 0.0
  w_ed_ref: 0.0
  w_volsmooth: 0.0

metrics:
  hd95: false

selection:
  metric: loss_total
  mode: min

train:
  epochs: 2
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: false
  early_stop_patience: 0
