# Ablation: concat MLP fusion (vs HeartTTable).

seed: 42
deterministic: true
device: auto
output_dir: outputs/ablations/fusion_concat
run_name: fusion_concat

data:
  source: synthetic
  in_channels: 1
  num_frames: 8
  spatial_size: [16, 32, 32]
  batch_size: 2
  num_workers: 0
  train_samples: 16
  val_samples: 8
  clinical_dim: 4
  slice_sampling: false

model:
  arch: reconseg3d
  in_channels: 1
  num_seg_classes: 4
  base_channels: 16
  temporal_mode: temporal_conv
  clinical_dim: 4
  dropout: 0.2
  per_frame_recon: true
  predict_motion: true
  per_frame_seg: true
  fusion: concat
  task: joint

loss:
  w_seg: 1.0
  w_recon: 0.25
  w_mace: 0.0
  recon_loss: l1
  mace_loss: bce
  use_dice: true
  alpha1: 0.1
  alpha2: 1.0
  alpha3: 0.0
  w_warp: 0.1
  w_cycle: 0.1
  w_volsmooth: 0.05

metrics:
  hd95: false

selection:
  metric: loss_total
  mode: min

train:
  epochs: 2
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: false
  early_stop_patience: 0
