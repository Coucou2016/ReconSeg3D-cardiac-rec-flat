# M&Ms external generalization stub.
# Hard-fails in publication mode without data. Download: https://www.ub.edu/mnms/
# Tables remain 待补充 until licensed data are evaluated.

seed: 42
deterministic: true
device: auto
output_dir: outputs/mms_generalization
run_name: mms_generalization

data:
  source: mms
  root: data/mms
  allow_fake_data: false
  auto_fake: false
  in_channels: 1
  num_frames: 8
  spatial_size: [32, 64, 64]
  batch_size: 1
  num_workers: 0
  clinical_dim: 0
  slice_sampling: false

model:
  arch: reconseg3d
  in_channels: 1
  num_seg_classes: 4
  base_channels: 24
  temporal_mode: temporal_conv
  clinical_dim: 0
  dropout: 0.2
  per_frame_recon: true
  predict_motion: true
  per_frame_seg: true
  fusion: concat
  task: segmentation

loss:
  w_seg: 1.0
  w_recon: 0.25
  w_mace: 0.0
  w_cox: 0.0
  recon_loss: l1
  use_dice: true
  alpha1: 0.1
  alpha2: 1.0
  w_warp: 0.05
  w_cycle: 0.02
  w_inv: 0.1
  w_smooth: 0.05
  w_jac: 0.05
  w_loop: 0.05
  w_ed_ref: 0.05
  w_volsmooth: 0.01

metrics:
  hd95: true

selection:
  metric: dice_mean
  mode: max

train:
  epochs: 20
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: false
  early_stop_patience: 0
